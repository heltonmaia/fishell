[project]
name = "fishell"
version = "3.0.0a1"
description = "Concentrador de jobs com TUI para o cluster NPAD/UFRN"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.scripts]
fishell = "fishell.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python/fishell"]

[tool.pytest.ini_options]
testpaths = ["src/python/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

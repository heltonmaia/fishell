name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  bash:
    name: fishell.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sintaxe (bash -n)
        run: bash -n src/bash/fishell.sh

      - name: help roda sem config.sh
        run: |
          test ! -f config.sh
          FISHELL_NOANIM=1 NO_COLOR=1 ./bin/fishell.sh help | grep -q 'CONTROL PANEL'

      - name: shellcheck (bloqueia em erros)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error src/bash/fishell.sh bin/fishell.sh

      - name: shellcheck completo (informativo)
        continue-on-error: true
        run: shellcheck src/bash/fishell.sh bin/fishell.sh

      # O runner não tem .ssh/ (é gitignored), então o setup automático do
      # menu falharia e o painel nunca chegaria a ser desenhado.
      - name: setup completo com chave descartável
        env:
          FISHELL_NOANIM: '1'
          NO_COLOR: '1'
        run: |
          cp config/config.sh.example config.sh
          sed -i 's/seu_usuario_aqui/ci_user/' config.sh
          ./bin/fishell.sh keygen
          ./bin/fishell.sh setup
          grep -q '^Host npad$' ~/.ssh/config

      # Regressão do bug que o BOM ausente causava no Windows: as sentinelas
      # deixavam de casar e cada setup acrescentava um bloco novo.
      - name: setup repetido reescreve o bloco em vez de duplicar
        env:
          FISHELL_NOANIM: '1'
          NO_COLOR: '1'
        run: |
          ./bin/fishell.sh setup >/dev/null
          ./bin/fishell.sh setup >/dev/null
          n=$(grep -c '# ── fishell: begin ──' ~/.ssh/config || true)
          test "$n" = "1" || { echo "bloco duplicado ($n ocorrências)"; cat ~/.ssh/config; exit 1; }
          b=$(awk 'NF{exit} {c++} END{print c+0}' ~/.ssh/config)
          test "$b" -le 1 || { echo "linhas em branco acumulando no topo: $b"; exit 1; }

      # Em pt o painel tem acento, e printf '%-20s' preenche por BYTE — por
      # isso as duas línguas precisam ser checadas, não só uma.
      - name: painel mantém as 50 colunas em pt e en
        run: |
          for lang in pt en; do
            echo "── $lang ──"
            FISHELL_LANG=$lang FISHELL_NOANIM=1 NO_COLOR=1 \
              timeout 30 ./bin/fishell.sh </dev/null >panel-$lang.txt
            python3 .github/scripts/check_panel.py <panel-$lang.txt
          done
          grep -q 'sessão encerrada' panel-pt.txt
          grep -q 'session terminated' panel-en.txt

  powershell:
    name: fishell.ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 lê .ps1 sem BOM como ANSI e destrói toda a UI
      # Unicode — inclusive as sentinelas do bloco no ~/.ssh/config.
      - name: BOM UTF-8 obrigatório
        run: |
          if [ "$(head -c 3 src/powershell/fishell.ps1 | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
            echo "ERRO: fishell.ps1 precisa estar em UTF-8 COM BOM"
            exit 1
          fi

      - name: sintaxe (parser do PowerShell)
        shell: pwsh
        run: .github/scripts/Check-Syntax.ps1

      - name: PSScriptAnalyzer (bloqueia em erros)
        shell: pwsh
        run: .github/scripts/Invoke-Analyzer.ps1

  paridade:
    name: paridade sh x ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Os dois ports são escritos à mão em paralelo. A versão é o sinal mais
      # barato de que uma mudança não foi aplicada só de um lado.
      - name: versão igual nos dois ports
        run: |
          sh_v=$(sed -n 's/^FISHELL_VERSION="\(.*\)"$/\1/p' src/bash/fishell.sh)
          ps_v=$(sed -n "s/^\$FishellVersion = '\(.*\)'\$/\1/p" src/powershell/fishell.ps1)
          echo "sh=$sh_v  ps1=$ps_v"
          test -n "$sh_v"
          test "$sh_v" = "$ps_v"

      - name: wrappers de bin/ apontam para arquivos existentes
        run: |
          test -x bin/fishell.sh
          test -f src/bash/fishell.sh
          grep -q 'src\\powershell\\fishell.ps1' bin/fishell.cmd
          test -f src/powershell/fishell.ps1
          echo "wrappers ok"

      - name: tabelas de idioma em paridade
        run: python3 .github/scripts/check_i18n.py

      - name: mesmos subcomandos nos dois ports
        run: |
          for c in setup login test upload download run keygen status help; do
            grep -qE "^ +$c[|)]" src/bash/fishell.sh || { echo "falta '$c' no fishell.sh"; exit 1; }
            grep -q "'$c'" src/powershell/fishell.ps1     || { echo "falta '$c' no fishell.ps1"; exit 1; }
          done
          echo "subcomandos ok"
